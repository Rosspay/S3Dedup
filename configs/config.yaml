s3:
  endpoint: "localhost:9000"
  region: "us-east-1"
# : S3_ACCESS_KEY / S3_SECRET_KEY.
# , .
  access_key: "admin"
  secret_key: "password"
  use_path_style: true
  buckets:
  - name: "my-bucket"
    prefix: "my-prefix/"
  - name: "next-bucket"
    prefix: "next-prefix/"
dedup:
  hash_algo: "sha512"
  min_size_bytes: 100 #
  blob_bucket: "blobs-bucket"
  blob_prefix: "blobs/"
  mode: "pointer" # report_only | pointer
  delete_originals: true # :
cache:
  backend: "sqlite" # sqlite | leveldb
  path: "state.db"
schedule:
  scan_interval: "1m" #
  workers: 16 #
logging:
  level: "error"
  file: "service.log"